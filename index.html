<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adventure Hub</title><meta name="theme-color" content="#0b111b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Adventure Hub"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>
:root{--bg:#0b111b;--panel:#141e2c;--panel2:#1c2a3b;--border:#2b3b4c;--text:#eef3f8;--muted:#a2b1c1;--accent:#e9b968;--green:#75d2ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;min-height:100vh;display:grid;grid-template-columns:225px 1fr}.sidebar{border-right:1px solid var(--border);padding:28px 17px;background:#101926}.brand{font-weight:800;font-size:21px;letter-spacing:.2px;margin:0 10px 28px}.brand span{color:var(--accent)}.nav{display:block;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:11px;margin-bottom:5px}.nav.active{background:#28374a;color:white}.main{padding:30px 36px 70px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.7px}.heading{font-size:31px;margin:4px 0 4px}.sub{color:var(--muted);margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}.metric{font-size:28px;font-weight:800;margin:8px 0 2px}.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 13px}.section h2{font-size:20px;margin:0}.btn{background:var(--accent);border:0;color:#1d1b18;border-radius:10px;padding:10px 14px;font-weight:750}.btn.secondary{background:#26364a;color:white}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.item{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-top:1px solid var(--border);padding:14px 0}.item:first-child{border-top:0;padding-top:0}.item:last-child{padding-bottom:0}.item strong{font-size:16px}.pill{display:inline-block;background:#29433e;color:#91e2c5;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:750}.pill.demo{background:#483b29;color:#f1ca88}.detail{font-size:13px;color:var(--muted);margin-top:4px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #405064;background:#0d1724;color:white}textarea{min-height:76px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:20px;color:var(--muted);text-align:center}.notice{border:1px solid #5b4a2f;background:#2b261e;border-radius:12px;padding:12px 15px;color:#ebc88c;margin:15px 0}.footer{font-size:12px;color:var(--muted);margin-top:35px}.hidden{display:none!important}dialog{background:#172334;color:white;border:1px solid #455569;border-radius:16px;max-width:520px;width:calc(100% - 25px);padding:22px}dialog::backdrop{background:#000b}dialog h2{margin-top:0}a{color:#f4c57b} @media(max-width:760px){.shell{display:block}.sidebar{padding:14px;border-right:0;border-bottom:1px solid var(--border)}.brand{margin:0 0 10px;font-size:19px}.navwrap{display:flex;gap:4px;overflow:auto}.nav{width:auto;white-space:nowrap;padding:9px 12px;margin:0}.main{padding:23px 16px 65px}.grid{grid-template-columns:1fr}.heading{font-size:26px}.formgrid{grid-template-columns:1fr}.section{align-items:flex-start}}
@media(max-width:760px){.shell{padding-bottom:76px}.sidebar{position:fixed;z-index:10;bottom:0;left:0;right:0;border-top:1px solid var(--border);border-bottom:0;padding:8px 5px max(8px,env(safe-area-inset-bottom));background:#101926}.brand{display:none}.navwrap{justify-content:space-around;overflow:visible}.nav{font-size:11px;text-align:center;white-space:normal;padding:9px 4px;flex:1;line-height:1.25}.main{padding-top:max(25px,env(safe-area-inset-top));padding-bottom:30px}.card{padding:17px}.section{flex-wrap:wrap}.section h2{font-size:19px}.btn{min-height:42px}dialog{max-height:85dvh;overflow:auto}}@media(min-width:761px){.sidebar{position:sticky;top:0;height:100vh}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">▲ Adventure <span>Hub</span></div><div class="navwrap"><button class="nav active" data-tab="home">◈ Dashboard</button><button class="nav" data-tab="garage">▣ Cruiser Garage</button><button class="nav" data-tab="deals">◎ Deal Hunter</button><button class="nav" data-tab="travel">✈ Points Explorer</button><button class="nav" data-tab="settings">⚙ Settings</button></div></aside><main class="main" id="app"></main></div><dialog id="editor"><h2 id="modalTitle"></h2><form id="editForm"><div id="fields" class="formgrid"></div><div class="actions" style="margin-top:18px"><button class="btn" type="submit">Save</button><button class="btn secondary" type="button" onclick="document.getElementById('editor').close()">Cancel</button></div></form></dialog><script>
const KEY='adventure-hub-v1';const seed={vehicles:[{id:1,name:'1984 Toyota Land Cruiser FJ60',value:22500,notes:'Potential trade vehicle; estimated value $20k–$25k.'},{id:2,name:'1977 Toyota Land Cruiser FJ40',value:0,notes:'Project and maintenance vehicle.'},{id:3,name:'1978 Toyota Land Cruiser FJ40',value:42500,notes:'Previously discussed asking price; not a current appraisal.'}],deals:[{id:11,name:'Lincoln Power MIG 140 MP',price:920,category:'Welder',status:'Example — verify listing',notes:'Previously discussed South Jordan listing. Not checked live.'},{id:12,name:'FJ60 trade for FJ40',price:0,category:'Trade',status:'Search idea',notes:'Look for owners open to trades.'}],rewards:[{id:21,name:'Delta SkyMiles',balance:428000},{id:22,name:'Amex Membership Rewards',balance:276000},{id:23,name:'Marriott Bonvoy',balance:536000}],watchlist:[{id:31,name:'Delta award flights',details:'SLC departure; holiday travel; 40%+ discount target'},{id:32,name:'Premium Select fares',details:'November travel; two passengers; target under $1,200 each'},{id:33,name:'Welder bargains',details:'Miller and Lincoln MIG welders; Black Friday opportunities'}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}let tab='home';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toLocaleString();const num=n=>Number(n||0).toLocaleString();function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Browser storage unavailable. Export a backup to save your work.')}render()}function head(title,desc){return `<div class="eyebrow">Your personal command center</div><h1 class="heading">${title}</h1><p class="sub">${desc}</p>`}function button(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function section(title,action=''){return `<div class="section"><h2>${title}</h2>${action}</div>`}function item(title,desc,right=''){return `<div class="item"><div><strong>${esc(title)}</strong><div class="detail">${esc(desc)}</div></div><div>${right}</div></div>`}function list(items,renderer){return items.length?items.map(renderer).join(''):'<div class="empty">Nothing here yet. Add your first item.</div>'}function metrics(items){return `<div class="grid">${items.map(([name,val,desc])=>`<div class="card"><div class="muted">${name}</div><div class="metric">${val}</div><div class="detail">${desc}</div></div>`).join('')}</div>`}function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='home'){html=head('Welcome to Adventure Hub','Your vehicles, deals, and travel rewards — together in one place.')+metrics([['Vehicles',db.vehicles.length,'Saved in your garage'],['Deals',db.deals.length,'Tracked opportunities'],['Rewards',num(db.rewards.reduce((s,r)=>s+Number(r.balance||0),0)),'Combined points across programs']])+section('Your three workspaces')+`<div class="grid"><div class="card"><h2>▣ Cruiser Garage</h2><p class="muted">Vehicle records, maintenance notes, and values.</p>${button('Open Garage','go("garage")')}</div><div class="card"><h2>◎ Deal Hunter</h2><p class="muted">Compare listings and organize your trade ideas.</p>${button('Explore Deals','go("deals")')}</div><div class="card"><h2>✈ Points Explorer</h2><p class="muted">Rewards balances and flight-watch plans.</p>${button('View Rewards','go("travel")')}</div></div>`+section('Important prototype note')+`<div class="notice">This version does not automatically search marketplaces, connect to Delta, or send alerts. It is a functional personal organizer with example records and browser-local storage.</div>`}if(tab==='garage'){html=head('Cruiser Garage','Your vehicle collection and maintenance notes.')+metrics([['Vehicles',db.vehicles.length,'In your collection'],['Estimated values',money(db.vehicles.reduce((s,v)=>s+Number(v.value||0),0)),'User-entered estimates; not appraisals'],['Maintenance','Coming next','Service history and parts tracking']])+section('Your vehicles',button('+ Add Vehicle','edit("vehicles")'))+`<div class="card">${list(db.vehicles,v=>item(v.name,(v.notes||'')+(Number(v.value)?' • Estimated value: '+money(v.value):''),button('Edit',`edit("vehicles",${v.id})`,'secondary')+' '+button('Delete',`removeItem("vehicles",${v.id})`,'ghost')))}</div>`}if(tab==='deals'){html=head('Deal Hunter','Track potential purchases and interesting trades.')+`<div class="notice">Listings shown here are saved examples, not current or verified offers. Automated deal discovery is a future integration.</div>`+section('Saved opportunities',button('+ Add Deal','edit("deals")'))+`<div class="card">${list(db.deals,d=>item(d.name,`${d.category} • ${d.status} • ${d.notes||''}`,`<div style="text-align:right">${d.price?`<strong>${money(d.price)}</strong><br>`:''}${button('Edit',`edit("deals",${d.id})`,'secondary')} ${button('Delete',`removeItem("deals",${d.id})`,'ghost')}</div>`))}</div>`+section('Search ideas',button('+ Add Watch','edit("watchlist")'))+`<div class="card">${list(db.watchlist.filter(w=>!w.name.toLowerCase().includes('delta')&&!w.name.toLowerCase().includes('premium')),w=>item(w.name,w.details,button('Edit',`edit("watchlist",${w.id})`,'secondary')+' '+button('Delete',`removeItem("watchlist",${w.id})`,'ghost')))}</div>`}if(tab==='travel'){html=head('Points Explorer','Manage rewards balances and travel opportunities.')+metrics(db.rewards.map(r=>[esc(r.name),num(r.balance),'Manually maintained balance']))+section('Reward programs',button('+ Add Program','edit("rewards")'))+`<div class="card">${list(db.rewards,r=>item(r.name,num(r.balance)+' points',button('Edit',`edit("rewards",${r.id})`,'secondary')+' '+button('Delete',`removeItem("rewards",${r.id})`,'ghost')))}</div>`+section('Travel watchlist',button('+ Add Watch','edit("watchlist")'))+`<div class="card">${list(db.watchlist,w=>item(w.name,w.details,button('Edit',`edit("watchlist",${w.id})`,'secondary')+' '+button('Delete',`removeItem("watchlist",${w.id})`,'ghost')))}</div><div class="notice">Points balances are editable estimates. No airline, hotel, or bank account is connected.</div>`}if(tab==='settings'){html=head('Settings & Data','Keep a copy of your information and customize the prototype.')+`<div class="card"><h2>Your data</h2><p class="muted">Records are stored in this browser only. They do not automatically sync between devices and may be lost if browser data is cleared.</p><div class="actions">${button('Export JSON backup','exportData()')}${button('Import JSON backup','$("#importFile").click()','secondary')}${button('Reset to demo data','resetData()','ghost')}</div><input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importData(event)"></div>`}$('#app').innerHTML=html+'<div class="footer">Adventure Hub • Prototype v2 • Local-only storage • No external account connections</div>'}function go(t){tab=t;render();window.scrollTo(0,0)}const schemas={vehicles:[['name','Vehicle name','text'],['value','Estimated value ($)','number'],['notes','Notes','textarea']],deals:[['name','Listing or opportunity','text'],['price','Price ($)','number'],['category','Category','text'],['status','Status','text'],['notes','Notes','textarea']],rewards:[['name','Rewards program','text'],['balance','Points balance','number']],watchlist:[['name','Watch name','text'],['details','Search preferences','textarea']]};let currentType,currentId;function edit(type,id){currentType=type;currentId=id||null;const record=db[type].find(x=>x.id===id)||{};$('#modalTitle').textContent=(id?'Edit ':'Add ')+({vehicles:'Vehicle',deals:'Deal',rewards:'Rewards Program',watchlist:'Watch'}[type]);$('#fields').innerHTML=schemas[type].map(([key,label,kind])=>`<label class="field ${kind==='textarea'?'wide':''}">${label}${kind==='textarea'?`<textarea name="${key}">${esc(record[key]||'')}</textarea>`:`<input name="${key}" type="${kind}" ${key==='name'?'required':''} value="${esc(record[key]??'')}" ${kind==='number'?'min="0"':''}>`}</label>`).join('');$('#editor').showModal()}$('#editForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const [key,label,kind] of schemas[currentType])if(kind==='number')data[key]=Number(data[key]||0);if(currentId){Object.assign(db[currentType].find(x=>x.id===currentId),data)}else db[currentType].push({id:Date.now(),...data});$('#editor').close();save()});function removeItem(type,id){if(confirm('Delete this item?')){db[type]=db[type].filter(x=>x.id!==id);save()}}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='adventure-hub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!['vehicles','deals','rewards','watchlist'].every(k=>Array.isArray(obj[k])))throw Error('Invalid backup format');if(confirm('Replace all current records with this backup?')){db=obj;save()}}catch(err){alert('Could not import: '+err.message)}};reader.readAsText(file)}function resetData(){if(confirm('Reset all records to the original sample data?')){db=structuredClone(seed);save()}}render();if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
